<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SENTINEL">
<meta name="theme-color" content="#080b10">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>SENTINEL — Strength Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10; --s1:rgba(255,255,255,.07); --s2:rgba(255,255,255,.1); --s3:rgba(255,255,255,.16); --line:rgba(255,255,255,.1);
  --tx:#fff; --tx2:rgba(255,255,255,.7); --tx3:rgba(255,255,255,.46);
  --volt:#c8f56a; --volt2:#a9e04a; --voltbg:rgba(200,245,106,.13); --ink:#10180a;
  --plum:rgba(8,12,18,.62); --plum2:#f2b45b; --cream:#fff; --lav:#7fd3ff;
  --cyan:#7fd3ff; --red:#ff6b6b; --amber:#f2b45b;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --head:'Plus Jakarta Sans',system-ui,sans-serif; --body:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif; --mono:'Plus Jakarta Sans',system-ui,sans-serif;
  --glass:rgba(255,255,255,.075); --gline:rgba(255,255,255,.13); --blur:blur(18px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
select option{color:#000}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#080b10}
.bgimg{position:absolute;inset:-20px;background-size:cover;background-position:center;opacity:0;transition:opacity .8s ease, transform 1.2s ease;transform:scale(1.04)}
.bgimg.on{opacity:1;transform:scale(1)}
.bgshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,16,.55) 0%,rgba(8,11,16,.72) 35%,rgba(8,11,16,.9) 70%,#080b10 100%)}
.ghost{position:absolute;top:calc(var(--st) + 54px);right:-10px;font-size:128px;font-weight:300;letter-spacing:-5px;line-height:1;color:rgba(255,255,255,.06);pointer-events:none;white-space:nowrap}

.app{position:relative;z-index:1;min-height:100vh;min-height:100dvh}
main{max-width:760px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 130px);position:relative}

/* ---------- top bar + day strip ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.topbar .logo svg{width:30px;height:30px;display:block}
.pill{height:38px;padding:0 16px;border-radius:999px;background:var(--glass);border:1px solid var(--gline);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.avatar-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#d9ff8a,#8fcf3c);color:var(--ink);font-weight:700;display:grid;place-items:center;font-size:16px}
.strip{display:flex;gap:6px;padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--gline);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);margin-bottom:12px;touch-action:pan-y}
.sday{flex:1;height:66px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;color:var(--tx3);font-size:10.5px;letter-spacing:1.2px;font-weight:600;transition:background .2s}
.sday b{font-size:20px;color:#fff;letter-spacing:0;font-weight:600}
.sday.today{box-shadow:inset 0 0 0 1.5px var(--volt)}
.sday.on{background:var(--volt);color:var(--ink)} .sday.on b{color:var(--ink)}
.sday i{position:absolute;top:8px;right:10px;width:7px;height:7px;border-radius:50%}
.sday i.done{background:var(--volt)} .sday.on i.done{background:var(--ink)} .sday i.miss{background:var(--red)}
.striphint{font-size:11px;color:var(--tx3);text-align:center;margin:-6px 0 10px}

/* ---------- dock ---------- */
.dock{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 16px);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(14,19,26,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.dbtn{height:52px;min-width:62px;padding:0 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tx2);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.dbtn.on{background:var(--volt);color:var(--ink)}
.dbtn .lbl{display:none} .dbtn.on .lbl{display:inline}

/* ---------- SENTINEL line ---------- */
.hud{margin-bottom:16px}
.sentline{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--gline);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:20px;padding:9px 9px 9px 12px;min-height:48px}
.eye{flex:none;width:12px;height:12px;border-radius:50%;background:var(--volt);box-shadow:0 0 12px var(--volt);animation:pulse 2.6s ease-in-out infinite;margin:0 4px}
@keyframes pulse{50%{opacity:.45}}
.sentline .msg{font-size:13px;color:var(--tx);line-height:1.45;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sentline .msg .who{color:var(--volt);font-weight:700;letter-spacing:.1em;margin-right:6px;font-size:10.5px}
.spk{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--tx2)}
.spk.on{background:var(--volt);color:var(--ink)}

/* ---------- type ---------- */
h1{font-family:var(--head);font-weight:300;font-size:46px;line-height:1;letter-spacing:-1.8px;margin:6px 0 8px}
h1 .acc,h2 .acc{color:var(--volt)}
h2{font-family:var(--head);font-weight:400;font-size:22px;letter-spacing:-.4px;margin:30px 0 12px}
.kicker{font-weight:600;letter-spacing:.16em;font-size:11px;color:var(--tx3);text-transform:uppercase}
.card .kicker,.done-banner .kicker{color:var(--volt)}
.sub{color:var(--tx2);font-size:14px;line-height:1.55}
.trio{display:flex;gap:14px;font-size:15px;color:var(--tx2);flex-wrap:wrap}
.trio span:nth-child(2){color:var(--volt)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{font-weight:500;font-size:12.5px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:#fff}
.tag.v{background:var(--volt);border-color:var(--volt);color:var(--ink);font-weight:600}

/* ---------- glass cards ---------- */
.card{background:var(--glass);border:1px solid var(--gline);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:24px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.stat .v{font-weight:300;font-size:32px;line-height:1;margin-top:8px;letter-spacing:-1px}
.stat .v small{font-size:13px;color:var(--tx3);font-weight:500;margin-left:2px;letter-spacing:0}
.stat .n{font-size:12px;color:var(--tx2);margin-top:5px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--volt);border-radius:6px}
.btn{height:50px;padding:0 22px;border-radius:999px;background:var(--s2);border:1px solid var(--gline);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;transition:transform .12s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.btn.full{width:100%}
.btn.sm{height:38px;font-size:13px;padding:0 14px}
.btn:disabled{opacity:.4}

.sess{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.clock{font-weight:300;font-size:34px;letter-spacing:-1px;color:#fff}
.clock.over{color:var(--amber)}
.clock small{display:block;font-size:10.5px;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase;font-weight:600}

.check{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.cb{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center}
.cb.on{background:var(--volt);border-color:var(--volt)}
.cb.on::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.check .t{flex:1;font-size:14px}
.check .t span{color:var(--tx3);font-size:12.5px;display:block;margin-top:1px}
.collapse-h{display:flex;align-items:center;justify-content:space-between;width:100%}
.collapse-h .meta{font-size:12px;color:var(--tx3)}

.ex{margin-top:12px}
.exh{display:flex;align-items:flex-start;gap:12px}
.exn{flex:1;min-width:0}
.exn .num{color:var(--volt);font-weight:600;letter-spacing:.12em;font-size:10.5px}
.exn .nm{font-weight:500;font-size:22px;line-height:1.15;margin-top:3px;letter-spacing:-.4px}
.exn .pr{color:var(--tx3);font-size:13px;margin-top:3px}
.wbtn{flex:none;text-align:center;background:rgba(200,245,106,.12);border:1px solid rgba(200,245,106,.35);border-radius:18px;padding:8px 12px;min-width:76px}
.wbtn .w,.wbtn .lv{font-weight:600;font-size:22px;line-height:1;color:var(--volt)}
.wbtn .w small{font-size:12px;color:var(--tx2);font-weight:500}
.wbtn .e{font-size:9.5px;color:var(--tx2);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cue{font-size:12.5px;color:var(--tx3);margin:10px 0 6px;line-height:1.5}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.set{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:18px;padding:6px 6px 6px 14px;transition:background .2s}
.set.done{background:rgba(200,245,106,.1);border-color:rgba(200,245,106,.3)}
.set .sn{font-weight:600;color:var(--tx3);width:46px;white-space:nowrap;font-size:11.5px;letter-spacing:.08em}
.set .tg{flex:1;font-size:13px;color:var(--tx2)}
.set .tg b{color:#fff;font-weight:600}
.step{display:flex;align-items:center;background:rgba(255,255,255,.1);border-radius:999px}
.step button{width:36px;height:40px;font-size:18px;color:#fff}
.step .val{min-width:26px;text-align:center;font-weight:600;font-size:17px}
.tick{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--tx3)}
.set.done .tick{background:var(--volt);color:var(--ink);box-shadow:0 6px 16px rgba(200,245,106,.3)}
.exfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--tx3)}
.hint{color:var(--volt);font-weight:600}

.rest{position:fixed;z-index:40;left:12px;right:12px;max-width:520px;margin:0 auto;bottom:calc(var(--sb) + 88px);background:rgba(14,19,26,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:26px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.rest.on{display:flex}
.rest .ring{flex:none;width:50px;height:50px}
.rest .rt{flex:1}
.rest .rt b{font-weight:500;font-size:24px;color:#fff}
.rest .rt small{display:block;font-size:10px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase;font-weight:600}

.lift{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.lift:first-child{border-top:0}
.lift .ln{flex:1;font-weight:500;font-size:14px}
.lift .ln span{display:block;color:var(--tx3);font-size:12px;font-weight:400}
.lift .ld{font-size:12px;color:var(--volt);min-width:46px;text-align:right;font-weight:600}

.weighrow{display:flex;gap:8px;margin-top:12px}
.inp{height:50px;border-radius:16px;background:rgba(255,255,255,.08);border:1.5px solid transparent;padding:0 16px;font-size:16px;width:100%;outline:none;color:#fff}
.inp:focus{border-color:var(--volt)}
.inp::placeholder{color:var(--tx3)}
svg.chart{width:100%;height:120px;display:block;margin-top:12px}

.chat{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;margin:10px 0}
.bub{padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.5;max-width:88%;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--volt);color:var(--ink)}
.bub.ai{align-self:flex-start;background:var(--s2)}
.bub.ai::before{content:"SENTINEL";display:block;font-size:10px;color:var(--volt);letter-spacing:.14em;margin-bottom:3px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:9px 14px;border-radius:999px;background:var(--s2);border:1px solid var(--gline)}

.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:rgba(18,24,32,.92);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:30px 30px 0 0;padding:22px 20px calc(var(--sb) + 22px)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:30px}}
.big{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0}
.big button{width:58px;height:58px;border-radius:50%;background:var(--s2);font-size:26px}
.big input{width:150px;text-align:center;font-weight:300;font-size:52px;background:transparent;border:0;outline:none;color:#fff}
.done-banner{margin-top:20px;padding:18px;border-radius:24px;background:var(--voltbg);border:1px solid rgba(200,245,106,.3)}
.muted{color:var(--tx3);font-size:12.5px}
a{color:var(--volt)}
.mic-live{animation:micpulse 1.4s ease-in-out infinite}@keyframes micpulse{50%{box-shadow:0 0 0 10px rgba(200,245,106,.2)}}

/* ---------- launch: welcome / profiles / passcode ---------- */
.launch{position:fixed;inset:0;z-index:70;display:none;color:#fff;overflow:hidden}
.launch.on{display:block}
.launch .lbg{position:absolute;inset:-20px;background-size:cover;background-position:center;transform:scale(1.08);animation:lzoom 6s ease-out forwards}
@keyframes lzoom{to{transform:scale(1)}}
.launch .lshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,16,.55),rgba(8,11,16,.8) 60%,#080b10)}
.launch .inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--st) + 70px) 28px calc(var(--sb) + 40px);max-width:520px;margin:0 auto}
.streak{position:absolute;left:-20%;width:140%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);filter:blur(1px);animation:streak 2.2s cubic-bezier(.3,.6,.2,1) infinite}
@keyframes streak{0%{transform:translateX(-40%);opacity:0}30%{opacity:1}100%{transform:translateX(40%);opacity:0}}
.draw path{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;transform:translateY(18px);filter:blur(8px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}
.lbar{animation:load 2.1s ease-in-out forwards;width:0}
@keyframes load{to{width:100%}}
.fadeout{animation:fo .45s ease forwards}@keyframes fo{to{opacity:0;transform:scale(1.02)}}
.pfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px;margin-top:34px}
.pftile{display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.pfface{position:relative;width:100%;aspect-ratio:1/1;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:600;letter-spacing:-2px;transition:transform .2s}
.pftile:active .pfface{transform:scale(.96)}
.pflock{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(10,15,21,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.pfadd{background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.3);backdrop-filter:blur(12px)}
.pindots{display:flex;gap:16px;justify-content:center;margin-top:28px}
.pindots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);transition:background .15s}
.pindots i.f{background:var(--volt);border-color:var(--volt);box-shadow:0 0 12px var(--volt)}
.pindots.bad i{background:var(--red);border-color:var(--red);box-shadow:none}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px 26px;justify-content:center;margin-top:auto}
.pk{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);font-size:28px;font-weight:300;color:#fff}
.pk:active{background:rgba(255,255,255,.2)}
.sheet .pad{margin-top:22px}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bgimg" id="bgA"></div><div class="bgimg" id="bgB"></div><div class="bgshade"></div><div class="ghost" id="ghost"></div></div>
<div class="app"><main id="main"></main></div>
<nav class="dock" id="dock" aria-label="Main"></nav>
<div class="launch" id="launch"></div>
<div class="rest" id="rest">
  <svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="5"/><circle id="ringc" cx="26" cy="26" r="22" fill="none" stroke="#c8f56a" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0" transform="rotate(-90 26 26)"/></svg>
  <div class="rt"><small>Rest</small><b id="restt">0:00</b></div>
  <button class="btn sm" data-act="restAdd">+15s</button>
  <button class="btn sm p" data-act="restSkip">Go</button>
</div>
<div class="modal" id="modal" data-act="modalBg"><div class="sheet" id="sheet"></div></div>

<script>
/* ================= PROGRAMME DATA ================= */
const EX = {
  squat:{n:'Back Squat',t:'bb',inc:2.5,cue:'Brace hard, sit between the hips, drive the floor away. Depth: hip crease below knee.'},
  bench:{n:'Bench Press',t:'bb',inc:2.5,cue:'Shoulder blades pinned, feet planted, touch lower chest, press back over shoulders.'},
  row:{n:'Barbell Row',t:'bb',inc:2.5,cue:'Hinge ~45°, pull to the belly button, no heaving. Control the lowering.'},
  rdl:{n:'Romanian Deadlift',t:'bb',inc:5,cue:'Soft knees, push hips back, bar skims thighs. Stop when hamstrings max out.'},
  deadlift:{n:'Deadlift',t:'bb',inc:5,cue:'Bar over midfoot, lats tight, push the floor away. Reset every rep.'},
  ohp:{n:'Overhead Press',t:'bb',inc:2.5,cue:'Squeeze glutes, ribs down, bar straight up, head through at the top.'},
  pulldown:{n:'Lat Pulldown',t:'mc',inc:2.5,cue:'Chest up, drive elbows to back pockets, 2-second return.'},
  lunge:{n:'DB Walking Lunge',t:'db',inc:2,unit:'/leg',cue:'Long stride, back knee kisses the floor. Weight is per dumbbell; reps per leg.'},
  legpress:{n:'Leg Press',t:'mc',inc:10,cue:'Full depth without the lower back peeling off. Don\'t lock the knees.'},
  incline:{n:'Incline DB Press',t:'db',inc:2,cue:'30° bench, elbows ~45°, deep stretch at the bottom. Weight per dumbbell.'},
  cablerow:{n:'Seated Cable Row',t:'mc',inc:5,cue:'Tall torso, squeeze shoulder blades together, 1-second pause.'},
  hipthrust:{n:'Barbell Hip Thrust',t:'bb',inc:5,cue:'Chin tucked, ribs down, full lockout, 1-second squeeze at the top.'},
  lateral:{n:'DB Lateral Raise',t:'db',inc:1,cue:'Lead with the elbows, stop at shoulder height, slow on the way down.'},
  bss:{n:'Bulgarian Split Squat',t:'db',inc:2,unit:'/leg',cue:'Rear foot on bench, torso slightly forward. Weight per dumbbell; reps per leg.'},

        body:JSON.stringify({contents:[{parts:[{text:'Read this aloud in a calm, cool, confident mission-control voice — smooth, clear, British English, unhurried: '+text}]}],
          generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}})});
      if(r.ok){ const j=await r.json(); const part=(((j.candidates||[])[0]||{}).content||{}).parts||[]; const p=part.find(x=>x.inlineData); if(p){ data=p.inlineData; S.gmodel=m; break; } last='empty'; }
      else { last=String(r.status); if(r.status!==404 && r.status!==400) break; }
    }
    if(!data) throw new Error(last||'failed');
    const rate=+((data.mimeType||'').match(/rate=(\d+)/)||[0,24000])[1];
    buf={b64:data.data,rate}; gCache.set(ck,buf); if(gCache.size>80) gCache.delete(gCache.keys().next().value);
  }
  ensureAudio(); if(!actx) throw new Error('audio');
  const bin=atob(buf.b64); const n=bin.length>>1; const ab=actx.createBuffer(1,n,buf.rate); const ch=ab.getChannelData(0);
  for(let i=0;i<n;i++){ let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8); if(v>=32768) v-=65536; ch[i]=v/32768; }
  try{ speechSynthesis.cancel(); }catch(e){}
  if(gSrc){ try{ gSrc.stop(); }catch(e){} }
  gSrc=actx.createBufferSource(); gSrc.buffer=ab; gSrc.connect(actx.destination); gSrc.start();
}

function chart(){
  const pts=[...S.weighins].sort((a,b)=>a.d<b.d?-1:1); const s=parseD(S.startDate), e=parseD(G().by);
  const span=Math.max(1,daysBetween(s,e)); const W=600,H=120,pad=8;
  const lo=G().target-1, hi=Math.max(G().start+1,...pts.map(p=>p.kg));
  const X=d=>pad+(W-2*pad)*Math.max(0,Math.min(1,daysBetween(s,parseD(d))/span));
  const Y=k=>pad+(H-2*pad)*(1-(k-lo)/(hi-lo));
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.kg).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
   <line x1="${X(S.startDate)}" y1="${Y(G().start)}" x2="${X(G().by)}" y2="${Y(G().target)}" stroke="#7fd3ff" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
   <line x1="${pad}" y1="${Y(G().target)}" x2="${W-pad}" y2="${Y(G().target)}" stroke="rgba(255,255,255,.12)" vector-effect="non-scaling-stroke"/>
   ${pts.length>1?`<path d="${line}" fill="none" stroke="#c8f56a" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`:''}
   ${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.kg)}" r="3.5" fill="#c8f56a"/>`).join('')}
  </svg><div class="muted"><span style="color:var(--cyan)">- - -</span> plan to ${G().target}kg &nbsp; <span style="color:var(--volt)">●</span> your weigh-ins</div>`;
}

/* ================= RENDER: DAY ================= */
function renderDay(){
  const w=view.w, i=view.d, d=DAYS[i], W=WEEKS[w];
  const log=getLog(w,d.key,false)||{sets:{},warm:[],cool:[],done:false};
  const date=sessionDate(w,i);
  let h=hud();
  h+=`<div class="kicker">Week ${w} · Day ${i+1} · ${date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}</div>
      <h1>${d.name}<span class="acc">.</span></h1>${trio(d.focus)}
      <div class="tags"><span class="tag v">${W.tag}</span><span class="tag">${W.rpe}</span><span class="tag">~60 min</span>${log.done?'<span class="tag v">✓ Complete</span>':''}</div>
      <div class="sub" style="margin-top:12px">${W.note}</div>`;
  h+=`<div class="sess card" style="margin-top:14px">`;
  if(log.startedAt && !log.done){ h+=`<div class="clock" id="clock"><small>Session clock</small>--:--</div><div class="muted" style="text-align:right">Target 60:00<br>Warm-up → lifts → stretch</div>`; }
  else if(log.done){ const m=Math.round(((log.completedAt||0)-(log.startedAt||log.completedAt||0))/60000); h+=`<div><div class="kicker">Logged</div><div class="sub">${log.startedAt?m+' min session':'Session complete'}</div></div><button class="btn sm" data-act="reopen">Reopen</button>`; }
  else { h+=`<div><div class="kicker">Ready</div><div class="sub">Start the 60-minute clock when you walk in.</div></div><button class="btn p" data-act="start">Start</button>`; }
  h+=`</div>`;
  h+=checklist('warm','Warm-up & mobility','8 min',WARM,log.warm,openWarm);
  d.ex.forEach((e,k)=>{ h+=exCard(w,i,k,e,log); });
  h+=checklist('cool','Cool-down stretch','5 min',COOL,log.cool,openCool);
  if(!log.done) h+=`<button class="btn p full" style="margin-top:20px;height:56px;font-size:19px" data-act="complete">Complete session</button><div class="muted" style="text-align:center;margin-top:8px">Hit the top of the rep range on every set → weight goes up automatically.</div>`;
  else if(log.summary) h+=`<div class="done-banner"><div class="kicker">Debrief</div><div class="sub" style="color:var(--tx);margin-top:6px">${esc(log.summary)}</div></div>`;
  return h;
}
function checklist(kind,title,mins,items,state,open){
  state=state||[]; const n=state.filter(Boolean).length;
  return `<div class="card" style="margin-top:12px"><button class="collapse-h" data-act="fold" data-k="${kind}"><div style="text-align:left"><div class="kicker">${title}</div><div class="meta" style="margin-top:3px">${mins} · ${n}/${items.length} done</div></div><span style="transform:rotate(${open?90:0}deg);transition:.2s;color:var(--tx3)">${ICON.chev}</span></button>
  ${open?`<div style="margin-top:8px">${items.map((it,j)=>`<button class="check" style="width:100%;text-align:left" data-act="chk" data-k="${kind}" data-j="${j}"><div class="cb ${state[j]?'on':''}"></div><div class="t">${it[0]}<span>${it[1]}</span></div></button>`).join('')}</div>`:''}</div>`;
}
function exCard(w,i,k,e,log){
  const [id,base,lo,hi,rest]=e; const X=EX[id]; const n=setsFor(w,k,base);
  const arr=(log.sets&&log.sets[id+'@'+k])||[];
  const wk=workW(w,id);
  const reps= X.t==='time'? `${fmtKg(S.weights[id])}s hold` : X.t==='carry'? '40m' : (lo===hi? lo : lo+'–'+hi)+(X.unit?' '+X.unit:'')+' reps';
  let right='';
  if(X.t==='bb'||X.t==='db'||X.t==='mc'||X.t==='carry') right=`<button class="wbtn" data-act="editW" data-id="${id}"><div class="w">${fmtKg(wk)}<small>kg</small></div><div class="e">${X.t==='db'||X.t==='carry'?'per hand · ':''}edit</div></button>`;
  else if(X.t==='time') right=`<button class="wbtn" data-act="editW" data-id="${id}"><div class="w">${fmtKg(S.weights[id])}<small>s</small></div><div class="e">edit</div></button>`;
  else right=`<div class="wbtn"><div class="w" style="font-size:16px">BW</div><div class="e">bodyweight</div></div>`;
  let h=`<div class="card ex"><div class="exh"><div class="exn"><div class="num">${String(k+1).padStart(2,'0')} · ${k===0?'LEAD LIFT':'REST '+(rest>=60?Math.floor(rest/60)+':'+String(rest%60).padStart(2,'0'):rest+'s')}</div><div class="nm">${X.n}</div><div class="pr">${n} × ${reps}${k===0?' · rest '+Math.floor(rest/60)+':'+String(rest%60).padStart(2,'0'):''}</div></div>${right}</div>
  <div class="cue">${X.cue}</div><div class="sets">`;
  for(let s=0;s<n;s++){
    const st=arr[s]||{};
    const r = st.r!=null? st.r : hi;
    const counted = !(X.t==='time'||X.t==='carry');
    h+=`<div class="set ${st.done?'done':''}"><div class="sn">SET ${s+1}</div>
      <div class="tg">${st.done && st.w!=null && X.t!=='bw' && X.t!=='time' ? `<b>${fmtKg(st.w)}kg</b>` : ''}${X.t==='time'?`<b>${fmtKg(S.weights[id])}s</b>`:X.t==='carry'?'<b>40m</b>':''}</div>
      ${counted?`<div class="step"><button data-act="rep" data-ex="${id}" data-k="${k}" data-s="${s}" data-v="-1" aria-label="fewer reps">−</button><div class="val">${r}</div><button data-act="rep" data-ex="${id}" data-k="${k}" data-s="${s}" data-v="1" aria-label="more reps">+</button></div>`:''}
      <button class="tick" data-act="set" data-ex="${id}" data-k="${k}" data-s="${s}" data-rest="${rest}">${ICON.tick}</button></div>`;
  }
  const doneSets=arr.filter(x=>x&&x.done);
  let foot='';
  if(WEEKS[w].deload) foot='Deload — no progression this week';
  else if(X.t==='bw') foot=`Aim to add reps each week (max ${hi})`;
  else if(X.t==='time') foot=`All sets done → +${X.inc}s next time`;
  else if(X.t==='carry') foot=`All sets done → +${X.inc}kg next time`;
  else foot=`All sets at ${hi} → +${fmtKg(X.inc)}kg next time`;
  const ready = doneSets.length>=n && X.t!=='bw' && !WEEKS[w].deload && (X.t==='time'||X.t==='carry'||doneSets.every(x=>x.r>=hi));
  h+=`</div><div class="exfoot"><span class="${ready?'hint':''}">${ready?'▲ Weight goes up on completion':foot}</span><span>${doneSets.length}/${n}</span></div></div>`;
  return h;
}

  renderSide();

  m.innerHTML = view.type==='hq' ? renderHQ() : view.type==='fuel' ? renderFuel() : view.type==='week' ? renderWeek() : view.type==='block' ? renderBlock() : renderDay();

/* ================= ACTIONS ================= */
function go(v){ view=v; render(); window.scrollTo({top:0,behavior:'instant'}); }
function setRecord(w,dk,key,s){ const log=getLog(w,dk,true); log.sets[key]=log.sets[key]||[]; log.sets[key][s]=log.sets[key][s]||{}; return log.sets[key][s]; }

const COMPLIMENTS=['Confirmed.','Clean.','Logged.','Good set.','Copy.','Locked in.'];
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='modalBg' && ev.target!==b) return;
  ensureAudio();
  switch(a){
    case 'hq': go({type:'hq',w:view.w}); say(briefing()); break;
    case 'day': go({type:'day',w:b.dataset.w?+b.dataset.w:view.w,d:+b.dataset.d}); { const d=DAYS[view.d]; say(isDone(view.w,d.key)?`${d.name}. Secured.`:`${d.name}. ${d.ex.length} lifts.`); } break;
    case 'week': view.w=+b.dataset.w; render(); say(`Week ${view.w}. ${WEEKS[view.w].tag}.`); break;
    case 'voice': S.voice=!S.voice; save(); render(); if(S.voice) say(briefing(),true); else { try{tts&&tts.stop();speechSynthesis.cancel();}catch(e){} } break;
    case 'fold': if(b.dataset.k==='warm') openWarm=!openWarm; else openCool=!openCool; render(); break;
    case 'chk': { const log=getLog(view.w,DAYS[view.d].key,true); const arr=log[b.dataset.k]; arr[+b.dataset.j]=!arr[+b.dataset.j]; save(); render();
      const items=b.dataset.k==='warm'?WARM:COOL; if(arr.filter(Boolean).length===items.length) say(b.dataset.k==='warm'?'Mobility done. Lift.':'Cool-down done.'); } break;
    case 'start': { const log=getLog(view.w,DAYS[view.d].key,true); log.startedAt=Date.now(); save(); render(); say('Clock live. Sixty minutes.'); } break;
    case 'reopen': { const log=getLog(view.w,DAYS[view.d].key,true); log.done=false; save(); render(); say('Reopened.'); } break;
    case 'rep': { const d=DAYS[view.d]; const e=d.ex[+b.dataset.k]; const r=setRecord(view.w,d.key,b.dataset.ex+'@'+b.dataset.k,+b.dataset.s);
      const cur=r.r!=null?r.r:e[3]; r.r=Math.max(0,Math.min(30,cur+(+b.dataset.v))); save(); render(); } break;
    case 'set': { const d=DAYS[view.d]; const k=+b.dataset.k; const e=d.ex[k]; const id=b.dataset.ex; const r=setRecord(view.w,d.key,id+'@'+k,+b.dataset.s);
      if(r.done){ r.done=false; } else { r.done=true; if(r.r==null) r.r=e[3]; r.w=workW(view.w,id); startRest(+b.dataset.rest);
        const log=getLog(view.w,d.key,true); if(!log.startedAt) log.startedAt=Date.now();
        if(r.r<e[2] && EX[id].t!=='time' && EX[id].t!=='carry') say(`${r.r} reps. Hold weight.`);
        else if(r.r>=e[3]+3 && EX[id].t!=='bw') say('Too light. Raise it.');
        else say(COMPLIMENTS[Math.floor(Math.random()*COMPLIMENTS.length)]);
      } save(); render(); } break;
    case 'complete': complete(); break;
    case 'editW': openEdit(b.dataset.id); break;
    case 'modalBg': closeModal(); break;
    case 'mstep': { const i=$('#mval'); i.value=fmtKg(Math.max(0,(parseFloat(i.value)||0)+(+b.dataset.v))); } break;
    case 'msave': saveEdit(); break;
    case 'mcancel': closeModal(); break;
    case 'restAdd': rest.end+=15000; rest.total+=15; break;
    case 'restSkip': stopRest(); break;
    case 'weigh': { const v=parseFloat($('#wkg').value); if(!(v>40&&v<250)) { say('Check that number.'); break; } logWeigh(v); } break;
    case 'send': { const q=$('#ask').value.trim(); if(q){ $('#ask').value=''; ask(q); } } break;
    case 'ask': ask(b.dataset.q); break;
    case 'backup': { const t=JSON.stringify(S); navigator.clipboard && navigator.clipboard.writeText(t).then(()=>say('Backup copied.')).catch(()=>say('Copy blocked.')); } break;
    case 'reset': openConfirmReset(); break;
    case 'gsave': { const v=($('#gkeyin').value||'').trim(); if(v.length<20){ say('Key incomplete.'); break; } try{ localStorage.setItem(GKEY,v); }catch(e){} render(); ensureAudio(); geminiSpeak('SENTINEL online.').then(()=>{ const g=$('#gstat'); if(g) g.textContent='✓ AI voice working.'; }).catch(e=>{ const g=$('#gstat'); if(g) g.textContent=gErrText(e); }); } break;
    case 'gclear': try{ localStorage.removeItem(GKEY); }catch(e){} gCache.clear(); render(); say('Key removed.'); break;
    case 'gtest': { const g=$('#gstat'); if(g) g.textContent='Generating…'; geminiSpeak('Voice check. Cleared.').then(()=>{ const g2=$('#gstat'); if(g2) g2.textContent='✓ Playing '+(S.gvoice||'Kore')+'.'; }).catch(e=>{ const g2=$('#gstat'); if(g2) g2.textContent=gErrText(e); }); } break;
    case 'testVoice': speakOut('SENTINEL online.'); break;
    case 'doReset': { const keep={name:S.name,goal:S.goal,nutri:S.nutri}; S=Object.assign(fresh(),keep); } save(); closeModal(); render(); say('Reset complete.'); break;
  }
});

function logWeigh(v){
  const t=ymd(today()); S.weighins=S.weighins.filter(x=>x.d!==t); S.weighins.push({d:t,kg:Math.round(v*10)/10}); save(); render();
  const exp=expectedWeight(today()); const diff=v-exp;
  say(`${fmtKg(v)}kg. ${diff<=0.5?'On track.':'Behind. Tighten food.'}`);
}

function complete(){
  const w=view.w, d=DAYS[view.d]; const log=getLog(w,d.key,true);
  if(log.done) return;
  const ups=[], holds=[];
  if(!WEEKS[w].deload){
    d.ex.forEach(([id,base,lo,hi],k)=>{
      const X=EX[id]; const n=setsFor(w,k,base); const arr=(log.sets[id+'@'+k]||[]).filter(x=>x&&x.done);
      if(arr.length<n || X.t==='bw') return;
      if(X.t==='time'){ S.weights[id]+=X.inc; ups.push(`${X.n} → ${S.weights[id]}s`); return; }
      if(X.t==='carry'){ const used=Math.max(...arr.map(x=>x.w||0)); S.weights[id]=Math.max(S.weights[id],used+X.inc); ups.push(`${X.n} → ${fmtKg(S.weights[id])}kg`); return; }
      if(arr.every(x=>x.r>=hi)){
        let inc=X.inc; if(arr.every(x=>x.r>=hi+3)) inc*=2;
        const used=Math.max(...arr.map(x=>x.w||0));
        S.weights[id]=Math.max(S.weights[id], used+inc); ups.push(`${X.n} → ${fmtKg(S.weights[id])}kg`);
      } else holds.push(X.n);
    });
  }
  log.done=true; log.completedAt=Date.now(); if(!log.startedAt) log.startedAt=log.completedAt;
  const mins=Math.round((log.completedAt-log.startedAt)/60000);
  let sum = `Mission complete. Session ${doneCount()} of 20${mins>1?' in '+mins+' minutes':''}. `;
  if(WEEKS[w].deload) sum+='Deload logged — loads stay put.';
  else if(ups.length) sum+='Progressive overload applied: '+ups.join(', ')+'. Every day using these lifts is updated.';
  else sum+='No increases this time — repeat the weights and chase the top of the range.';
  if(holds.length) sum+=' Holding: '+holds.join(', ')+'.';
  log.summary=sum; save(); stopRest(); render(); say(`Mission complete.${ups.length?' '+ups.length+' lift'+(ups.length>1?'s':'')+' up.':''}`);
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function ensureAudio(){ try{ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx&&actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){ try{ if(!actx) return; [0,.22,.44].forEach((t,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=i===2?1320:880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001,actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.2); }); }catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} }
function startRest(sec){ rest={end:Date.now()+sec*1000,total:sec}; $('#rest').classList.add('on'); clearInterval(restT); restT=setInterval(tickRest,250); tickRest(); }
function stopRest(){ clearInterval(restT); $('#rest').classList.remove('on'); }
function tickRest(){
  const left=Math.max(0,rest.end-Date.now()); const s=Math.ceil(left/1000);
  $('#restt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('#ringc').setAttribute('stroke-dashoffset', (138.2*(1-left/(rest.total*1000))).toFixed(1));
  if(S.voice && s===10 && !rest.warned){ rest.warned=true; speakOut('Ten seconds.'); }
  if(left<=0){ stopRest(); beep(); say('Go.'); }
}

function SYSF(){ const g=G(); return `You are SENTINEL, ${S.name}'s personal strength-training AI — think a calm, razor-sharp AI butler in a high-tech suit: British English, dry wit, disciplined, loyal, never cheesy. Address them as ${S.name} occasionally. Replies: short and punchy (under 90 words) unless he asks for detail. No markdown headers or bullet spam; plain sentences.
About ${S.name}: ${g.start}kg at start, targeting ${g.target}kg by ${g.by}. Consistency is the main goal. Trains full body Mon–Thu at lunch, 60 minutes including 5–10 min mobility. Has done a half marathon and Hyrox; cardio will be added later — strength first. NHS pathway coordinator, new dad, also drives Uber, so time and sleep are tight.

async function ask(q){
  if(busy) return;
  if(!sample){ chatLog.push({role:'user',content:q},{role:'assistant',content:'Conversation module is offline in this view. Open the app from claude.ai while signed in to talk to me.'}); drawChat(); return; }
  busy=true; chatLog.push({role:'user',content:q}); chatLog.push({role:'assistant',content:'…'}); drawChat();
  const st=$('#aistate'); if(st) st.textContent='SENTINEL is thinking…';
  const hist=chatLog.slice(0,-1).slice(-12);
  const input=hist.map((m,i)=> i===hist.length-1 ? {role:'user',content:SYSF()+'\n\nLIVE DATA:\n'+JSON.stringify(context())+'\n\n'+S.name+' says: '+m.content} : m);
  if(input[0].role!=='user') input.shift();
  const tools=[
    {name:'set_working_weight',description:'Set the working weight (kg; seconds for plank) for one exercise. Applies to every day it appears.',inputSchema:{type:'object',properties:{exercise_id:{type:'string',enum:Object.keys(EX)},value:{type:'number'}},required:['exercise_id','value']},
      execute:({exercise_id,value})=>{ if(!EX[exercise_id]) throw new Error('unknown exercise'); if(!(value>=0&&value<1000)) throw new Error('bad value'); S.weights[exercise_id]=Math.round(value*10)/10; save(); return {ok:true,exercise:EX[exercise_id].n,value:S.weights[exercise_id]}; }},
    {name:'log_bodyweight',description:"Log today's bodyweight in kg.",inputSchema:{type:'object',properties:{kg:{type:'number'}},required:['kg']},
      execute:({kg})=>{ if(!(kg>40&&kg<250)) throw new Error('unrealistic'); const t=ymd(today()); S.weighins=S.weighins.filter(x=>x.d!==t); S.weighins.push({d:t,kg:Math.round(kg*10)/10}); save(); return {ok:true,kg}; }},
  ];
  try{
    const res=await sample(input,{cache:false,tools,onText:({text})=>{ chatLog[chatLog.length-1].content=text||'…'; const c=$('#chat'); if(c&&c.lastChild){ c.lastChild.textContent=chatLog[chatLog.length-1].content; c.scrollTop=c.scrollHeight; } }});
    chatLog[chatLog.length-1].content=res.text||'Done.';
    say(res.text.split(/(?<=[.!?])\s/)[0].slice(0,120), false);
    if(S.voice) speakOut(res.text.split(/(?<=[.!?])\s/)[0]);
  }catch(e){
    chatLog[chatLog.length-1].content = e&&e.code==='rate_limited' ? 'Too many requests — give me a minute.' : e&&e.code==='not_granted' ? 'You declined the AI permission. Logging still works.' : 'Link interrupted. Try again.';
    if(e&&e.code==='not_granted') sample=null;
  }
  busy=false; if($('#aistate')) $('#aistate').textContent='';
  render();
}

const UNITWORDS = ['tbsp','tablespoon','tsp','teaspoon','slice','scoop','cup','mug','glass','handful','tin','can','bowl','pot','pack','packet','bag','bottle','serving','portion','piece','fillet','breast','clove','chop','square','bar','whole','splash','half','cherry'];
const SIZEWORDS = ['small','medium','large'];
const UNITALIAS = {tablespoon:'tbsp',tablespoons:'tbsp',teaspoon:'tsp',teaspoons:'tsp',packet:'pack'};
const SHOPS = /\b(?:from|at)\s+(asda|lidl|tesco|aldi|sainsbury'?s?|morrisons|waitrose|m&s|marks and spencer|co-?op|iceland|costco|greggs|nando'?s|mcdonald'?s|subway|pret|kfc|starbucks|costa)\b/i;
const NUMWORDS = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,thirty:30,fifty:50,hundred:100};

function fuelDefaults(){ if(!S.food) S.food={}; if(!S.myFoods) S.myFoods={}; if(!S.water) S.water={}; if(!S.nutri) S.nutri={kcal:2200,p:160,f:70,c:220,water:3000}; }

function cap(s){ return s.replace(/\b\w/g,c=>c.toUpperCase()); }
function mealNow(){ const h=new Date().getHours(); return h<11?'Breakfast':h<15?'Lunch':h<17?'Snack':'Dinner'; }
function r0(x){ return Math.round(x); }
function r1(x){ return Math.round(x*10)/10; }

function aliasIndex(){
  const out=[];
  Object.entries(S.myFoods).forEach(([k,f])=>(f.aliases||[]).forEach(a=>out.push({a:a.toLowerCase(),k,my:true})));
  Object.entries(FOODS).forEach(([k,f])=>f[1].forEach(a=>out.push({a,k,my:false})));
  return out.sort((x,y)=> (y.my?1:0)-(x.my?1:0) || y.a.length-x.a.length);
}
function foodInfo(m){ // unify my-food and db food
  if(m.my){ const f=S.myFoods[m.k]; return {name:f.name,k:f.k,p:f.p,c:f.c,f:f.f,u:Object.assign({each:f.each||100},f.u||{}),my:true,brand:f.brand||''}; }
  const f=FOODS[m.k]; return {name:f[0],k:f[2],p:f[3],c:f[4],f:f[5],u:f[6],my:false};
}
function esc2(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function normalise(t){
  let s=' '+t.toLowerCase().replace(/[“”]/g,'"').replace(/[‘’]/g,"'")+' ';
  s=s.replace(/\b(\d+)\s*(?:and a half|½)\b/g,(m,n)=>String(+n+0.5));
  s=s.replace(/\bone and a half\b/g,'1.5').replace(/\bhalf (?:of )?(?:a|an|one)\b/g,'0.5').replace(/\bhalf\b(?=\s+(?:\w+))/g,'0.5').replace(/\ba quarter(?: of)?(?: a| an)?\b/g,'0.25').replace(/\bquarter(?: of)?(?: a| an)?\b/g,'0.25');
  s=s.replace(/\ba couple of\b/g,'2').replace(/\ba few\b/g,'3').replace(/\bcouple of\b/g,'2');
  s=s.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifteen|twenty|thirty|fifty|hundred)\b/g,m=>NUMWORDS[m]);
  s=s.replace(/\b(a|an)\b(?=\s)/g,'1');
  s=s.replace(/(\d)\s*(grams?|gr)\b/g,'$1g').replace(/(\d)\s*(millilit(?:re|er)s?)\b/g,'$1ml');
  return s;
}

function parseMeal(text){
  const quotes=[]; let t=text.replace(/"([^"]+)"|'([^']{2,})'/g,(m,a,b)=>{ quotes.push(a||b); return ` __q${quotes.length-1}__ `; });
  let meal=null; const mm=t.match(/\b(breakfast|lunch|dinner|supper|snack|suhoor|iftar)\b/i); if(mm){ const w=mm[1].toLowerCase(); meal = w==='supper'||w==='iftar'?'Dinner':w==='suhoor'?'Breakfast':cap(w); }
  t=normalise(t);
  const segs=t.split(/,|;|\n|\band\b|\bwith\b|\bplus\b|&|\balso\b|\bthen\b|\balongside\b|\btopped\b/).map(x=>x.trim()).filter(Boolean);
  const idx=aliasIndex(); const items=[];
  segs.forEach(seg=>{
    let brand=''; const sm=seg.match(SHOPS); if(sm) brand=cap(sm[1].replace(/'s?$/,''));
    const qn=[...seg.matchAll(/__q(\d+)__/g)].map(m=>quotes[+m[1]]); if(qn.length) brand=(brand?brand+' ':'')+qn.map(x=>'"'+x+'"').join(' ');
    let clean=seg.replace(/__q\d+__/g,' ').replace(SHOPS,' ').replace(/\b(i|i've|ive|i'd|had|have|ate|eaten|eat|drank|drink|for|my|some|of|the|this|that|today|morning|breakfast|lunch|dinner|snack|called|brand|just|about|around|roughly|approx|like|it|was|were|on|in|toasted|fried|grilled|boiled|scrambled|cooked)\b/g,' ').replace(/\s+/g,' ').trim();
    if(!clean) return;
    let hit=null;
    for(const m of idx){ const re=new RegExp('(^|\\s)'+esc2(m.a)+'(e?s)?(?=\\s|$)'); if(re.test(' '+clean+' ')){ hit=m; break; } }
    if(!hit){
      const name=clean.replace(/\b\d+(?:\.\d+)?\s*(g|ml|kg|l)?\b/g,'').replace(/\b(small|medium|large)\b/g,'').trim();
      if(!name || /^\d*$/.test(name)) return;
      const q=clean.match(/(\d+(?:\.\d+)?)\s*(g|ml)\b/);
      items.push({id:uid(),name:cap(name),brand,amount:q?q[1]+q[2]:'1',g:q?+q[1]:0,count:1,kcal:0,p:0,c:0,f:0,k100:0,p100:0,c100:0,f100:0,unknown:true,src:'?'});
      return;
    }
    const F=foodInfo(hit);
    let g=null, label='', count=1;
    const wm=clean.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l)\b/);
    if(wm){ g=+wm[1]*(wm[2]==='kg'||wm[2]==='l'?1000:1); label=wm[1]+wm[2]; }
    else{
      const nm=clean.match(/(\d+(?:\.\d+)?)/); if(nm) count=+nm[1];
      let unit=null;
      for(const w of UNITWORDS){ if(new RegExp('\\b'+w+'(e?s)?\\b').test(clean)){ const u=UNITALIAS[w]||w; if(F.u[u]!=null){ unit=u; break; } } }
      if(!unit) for(const w of SIZEWORDS){ if(new RegExp('\\b'+w+'\\b').test(clean) && F.u[w]!=null){ unit=w; break; } }
      const per = unit? F.u[unit] : (F.u.each||F.u.serving||100);
      g=count*per; label=(r1(count)+'').replace(/^0\.5$/,'½')+(unit?' '+unit:'');
    }
    const it={id:uid(),name:F.name,brand:brand||F.brand||'',amount:label,g:r0(g),count,k100:F.k,p100:F.p,c100:F.c,f100:F.f,src:F.my?'my':'db'};
    calcItem(it); items.push(it);
  });
  return {items, meal: meal||mealNow(), text};
}
function calcItem(it){ const m=(it.g||0)/100; it.kcal=r0(it.k100*m); it.p=r1(it.p100*m); it.c=r1(it.c100*m); it.f=r1(it.f100*m); return it; }
function uid(){ return Math.random().toString(36).slice(2,9); }

function dayItems(d){ return (S.food[d]||[]); }
function totals(list){ return list.reduce((a,x)=>({kcal:a.kcal+(+x.kcal||0),p:a.p+(+x.p||0),c:a.c+(+x.c||0),f:a.f+(+x.f||0)}),{kcal:0,p:0,c:0,f:0}); }
function onTarget(d){ const T=S.nutri, t=totals(dayItems(d)); return dayItems(d).length>0 && t.p>=T.p*0.9 && t.kcal<=T.kcal+100 && t.kcal>=T.kcal*0.6; }
function fuelStreak(){ let n=0; const d=today(); if(onTarget(ymd(d))) n++; d.setDate(d.getDate()-1); for(let i=0;i<365;i++){ if(onTarget(ymd(d))){ n++; d.setDate(d.getDate()-1);} else break; } return n; }
function weekScore(){ let n=0; const d=today(); for(let i=0;i<7;i++){ if(onTarget(ymd(d))) n++; d.setDate(d.getDate()-1); } return n; }

function fuelShort(d){ const T=S.nutri, list=dayItems(d), t=totals(list);
  if(!list.length) return 'Nothing logged.'; if(t.kcal>T.kcal+100) return `Over by ${r0(t.kcal-T.kcal)} kcal.`; if(t.p>=T.p) return 'Targets secured.';
  return `${Math.max(0,r0(T.kcal-t.kcal))} kcal, ${Math.max(0,r0(T.p-t.p))}g protein left.`; }
function fuelAdvice(d){
  const T=S.nutri, list=dayItems(d), t=totals(list), isToday=d===ymd(today()); const h=new Date().getHours();
  const kLeft=r0(T.kcal-t.kcal), pLeft=r0(T.p-t.p), w=S.water[d]||0;
  if(!list.length) return isToday? (h<12?'No intel logged yet. Open the day with 30g+ of protein — eggs, Greek yoghurt or a shake.':'Nothing logged today, '+S.name+'. Accountability starts with the first entry. Tell me what you\'ve eaten.') : 'No entries for this day.';
  let a='';
  if(t.kcal>T.kcal+100) a=`Calorie ceiling breached by ${r0(t.kcal-T.kcal)} kcal. No drama — hold tomorrow tight and keep protein high.`;
  else if(t.p>=T.p && t.kcal<=T.kcal+100) a=`Targets secured. Protein hit, ${Math.max(0,kLeft)} kcal in reserve. Textbook execution.`;
  else if(isToday && h>=18 && t.p<T.p*0.75) a=`Protein at ${r0(t.p/T.p*100)}%. Objective: ${pLeft}g before bed — chicken, Greek yoghurt or a shake. Keep it lean.`;
  else a=`${Math.max(0,kLeft)} kcal and ${Math.max(0,pLeft)}g protein remaining. Protein first at the next meal.`;
  if(t.f>T.f*1.15) a+=' Fat is running high — go easy on the oil and cheese.';
  if(isToday && h>=14 && w<T.water*0.5) a+=` Hydration at ${r1(w/1000)}L. Drink up.`;
  return a;
}

function ring(pct,size,stroke,col,label,sub){
  const r=(size-stroke)/2, C=2*Math.PI*r, off=C*(1-Math.min(1,pct));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--s2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${pct>1.05?'var(--red)':col};transition:stroke-dashoffset .6s" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
   <text x="50%" y="${label&&sub?'47%':'53%'}" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="${size*0.17}" style="fill:var(--tx)">${label}</text>${sub?`<text x="50%" y="64%" text-anchor="middle" font-family="Poppins" font-size="${size*0.075}" style="fill:var(--tx3)">${sub}</text>`:''}</svg>`;
}
function macroBar(lbl,val,tgt,col){ const p=Math.min(100,val/tgt*100); return `<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:600">${lbl}</span><span style="color:var(--tx2)">${r0(val)} / ${tgt}g</span></div><div class="bar" style="margin-top:6px"><i style="width:${p}%;background:${col}"></i></div></div>`; }

}

function micUI(){ const keep=$('#ftext')?$('#ftext').value:''; render(); const t=$('#ftext'); if(t) t.value=keep; }
function startTimer(){ clearInterval(recTimer); const t0=Date.now(); recTimer=setInterval(()=>{ const el=$('#rectime'); if(!el) return; const s=Math.floor((Date.now()-t0)/1000); el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(s>=120 && recState) toggleMic(); },250); }
async function toggleMic(){
  if(decoding) return;
  if(listening){ return stopListening(); }
  if(gkey() && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{ await startRecording(); listening=true; micUI(); startTimer(); return; }
    catch(e){ console.warn(e); say(e&&e.name==='NotAllowedError'?'Mic blocked.':'Using device listening.'); }
  }
  startDeviceSR();
}
async function startRecording(){
  ensureAudio(); if(!actx) throw new Error('audio');
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  if(actx.state==='suspended') await actx.resume();
  const src=actx.createMediaStreamSource(stream); const proc=actx.createScriptProcessor(4096,1,1); const chunks=[];
  proc.onaudioprocess=e=>{ chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  const mute=actx.createGain(); mute.gain.value=0; src.connect(proc); proc.connect(mute); mute.connect(actx.destination);
  recState={stream,src,proc,mute,chunks,rate:actx.sampleRate};
}
function stopListening(){
  listening=false; clearInterval(recTimer);
  if(recState){ const r=recState; recState=null;
    try{ r.proc.disconnect(); r.src.disconnect(); r.mute.disconnect(); }catch(e){} r.stream.getTracks().forEach(t=>t.stop());
    const len=r.chunks.reduce((a,c)=>a+c.length,0);
    if(len < r.rate*0.6){ micUI(); say('Didn\'t catch that.'); return; }
    const wav=encodeWav(r.chunks,len,r.rate,16000);
    decoding=true; micUI(); say('Decoding.');
    aiFood({audio:wav}).then(res=>applyAI(res)).catch(e=>{ decoding=false; micUI(); say('Decode failed. '+gErrText(e)); });
    return;
  }
  if(rec){ try{ rec.stop(); }catch(e){} }
}
function encodeWav(chunks,len,inRate,outRate){
  const all=new Float32Array(len); let o=0; chunks.forEach(c=>{ all.set(c,o); o+=c.length; });
  const ratio=inRate/outRate, n=Math.floor(len/ratio), pcm=new Int16Array(n);
  let peak=0; for(let i=0;i<len;i++){ const a=Math.abs(all[i]); if(a>peak) peak=a; } const gain=peak>0.02&&peak<0.5?0.9/peak:1;
  for(let i=0;i<n;i++){ const s0=Math.floor(i*ratio), s1=Math.min(len,Math.floor((i+1)*ratio)); let sum=0; for(let j=s0;j<s1;j++) sum+=all[j]; let v=(sum/Math.max(1,s1-s0))*gain; v=Math.max(-1,Math.min(1,v)); pcm[i]=v<0?v*0x8000:v*0x7fff; }
  const buf=new ArrayBuffer(44+pcm.length*2), dv=new DataView(buf); const w=(off,str)=>{ for(let i=0;i<str.length;i++) dv.setUint8(off+i,str.charCodeAt(i)); };
  w(0,'RIFF'); dv.setUint32(4,36+pcm.length*2,true); w(8,'WAVE'); w(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,outRate,true); dv.setUint32(28,outRate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,'data'); dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);
  const bytes=new Uint8Array(buf); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
function startDeviceSR(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const ta=$('#ftext');
  if(!SR){ ta&&ta.focus(); say('Use keyboard mic.'); return; }
  srBase=ta?ta.value.trim():''; srFinals=''; listening=true; micUI(); startTimer();
  const run=()=>{
    rec=new SR(); rec.lang='en-GB'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal){ const t=r[0].transcript.trim(); if(t && !srFinals.trim().endsWith(t)) srFinals+=t+' '; } else interim+=r[0].transcript; }
      const el=$('#ftext'); if(el) el.value=[srBase,srFinals.trim(),interim?'…'+interim:''].filter(Boolean).join(' '); };
    rec.onend=()=>{ if(listening){ try{ run(); }catch(e){ finishSR(); } } else finishSR(); };
    rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ listening=false; say('Mic blocked.'); } };
    try{ rec.start(); }catch(e){}
  };
  run(); say('Listening.');
}
function finishSR(){ clearInterval(recTimer); const txt=[srBase,srFinals.trim()].filter(Boolean).join(' ').trim(); rec=null; micUI(); const el=$('#ftext'); if(el) el.value=txt; if(txt) draftFromText(txt); }

async function aiFood({audio,text}){
  const key=gkey(); if(!key) throw new Error('nokey');

function applyAI(res){

async function hashPin(id,code){
  const str='sentinel|'+id+'|'+code;
  try{ const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)); return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=5381; for(const ch of str) h=((h<<5)+h+ch.charCodeAt(0))|0; return 'x'+(h>>>0).toString(16); }
}

async function pinPress(v){
  if(pin.busy) return;
  if(v==='del'){ pin.buf=pin.buf.slice(0,-1); pinRefresh(); return; }
  if(pin.buf.length>=6) return; pin.buf+=v; pinRefresh();
  if(pin.buf.length<6) return;
  pin.busy=true; const code=pin.buf; const P=profOf(pin.id);
  await new Promise(r=>setTimeout(r,120));
  if(pin.ctx==='launch' || pin.ctx==='vchange' || pin.ctx==='vremove'){
    const ok = P && P.pin && (await hashPin(P.id,code))===P.pin;
    if(!ok){ pin.buf=''; pinRefresh('Wrong code. Try again.',true); pin.busy=false; return; }
    if(pin.ctx==='launch'){ pin.busy=false; enterProfile(P.id); return; }
    if(pin.ctx==='vremove'){ P.pin=null; saveProfiles(); pin.busy=false; closeModal(); render(); say('Passcode removed.'); return; }
    pin.ctx='set1'; pin.buf=''; setPinTitle('New passcode'); pinRefresh('Choose 6 digits.'); pin.busy=false; return;
  }
  if(pin.ctx==='set1'){ pin.first=code; pin.ctx='set2'; pin.buf=''; setPinTitle('Confirm passcode'); pinRefresh('Enter it once more.'); pin.busy=false; return; }
  if(pin.ctx==='set2'){

    P.pin=await hashPin(P.id,code); saveProfiles(); pin.busy=false; closeModal(); render(); say('Passcode set.'); return;
  }
  pin.busy=false;
}

    case 'block': go({type:'block',w:5}); break;
    case 'newblock': startNewBlock(); break;
    case 'pk': ensureAudio(); pinPress(b.dataset.v); break;
    case 'lpick': { const P=profOf(b.dataset.id); if(P&&P.pin) showLaunchPin(P.id); else enterProfile(b.dataset.id); } break;
    case 'lpicker': showPicker(); break;
    case 'pinforgot': forgotPin(); break;
    case 'pinwipe': wipeLocked(); break;
    case 'pinset': openPinSheet('set1'); break;
    case 'pinchange': openPinSheet('vchange'); break;
    case 'pinremove': openPinSheet('vremove'); break;
  }
});

/* ---------- boot ---------- */
lastMsg=briefing();
render();
showWelcome();
setTimeout(()=>{ const el=$('#smsg'); if(el) typeOut(el,lastMsg); },150);
(async()=>{
  initCloud();
  if(window.claude && claude.use){
    try{ sample=await claude.use('sample'); }catch(e){ sample=null; }
    try{ tts=await claude.use('tts'); }catch(e){ tts=null; }
    if(view.type==='hq') drawChat();
  }
})();
</script>
